[quests]
water_for_the_desert_title = "Water for the Desert"
water_for_the_desert_desc = "The desert town is dying of thirst. Mayor Arse believes water spirits sleep at the bottom of Chesburg's well, and that the desert mayor can use them to make water."
yules_ball_title = "Yule's Ball"
yules_ball_desc = "A kid by the well kicked their ball down it. Find it near where you land, and bring it back."
goo_for_marta_title = "Goo for Marta"
goo_for_marta_desc = "Marta the baker ran out of slime goo for her jelly buns. Green slimes out past the hilltop drop it."
overgrown_ledges_title = "The Overgrown Ledges"
overgrown_ledges_desc = "A gust blew Brant the hiker's pack onto a high ledge outside town. Jump the gap, climb the wall, and bring it back."
missing_cat_title = "The Missing Cat"
missing_cat_desc = "Mrs. Tuppence's cat Biscuit hasn't come home since yesterday. Cats leave traces: look for fur, paw prints and stolen snacks around town, follow them to Biscuit, and bring him home."
