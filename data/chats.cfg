; Conversations two neighbours have when they stop for a chat (see world/npc_chat.gd).
; Section = the NpcChat's `chat_id`. Each key is one conversation; one is picked at random.
; "A:" is the first NPC, "B:" the second; "|" separates the lines. Values are quoted strings.

[Brant_Fenn]
c1="A: Got my pack back, Fenn. Don't ask how high that ledge was. | B: Ha! I'd have waited for it to fall on its own. | A: Your perch stew was worth the climb, mind. | B: Bring me onions and there'll be a second bowl."
c2="B: That lake's been generous lately. | A: Funny, you used to complain it never bit. | B: Had a bit of help from a young fisher. | A: Mm. Same one who fetched my pack, I'd wager."
c3="A: Cold coming in tonight. | B: Warm up at your fire, then. I'll keep an eye on the water. | A: Don't stay out past dark. | B: The fish don't watch the clock, Brant."
c4="B: Do you ever miss the road? | A: Every day. And then I remember the blisters. | B: Ha! Sit a while. The town's got a way of keeping folk."
