; ------------------------------------------------------------------
; EDIT ME: what each enemy drops when you win the fight.
; One section per enemy id (green_slime, spinner, piercer), one line per drop:
;
;     item_id = [chance, min, max]
;
;   chance  0.0 - 1.0   (0.8 = 80% of kills drop it)
;   min/max             how many drop when it does
;
; item_id is an item's id (slime_goo, health_potion, shield_restore, key...).
; An enemy with no section — or an empty one — drops nothing.
; ------------------------------------------------------------------

[green_slime]
slime_goo = [0.8, 1, 2]
health_potion = [0.15, 1, 1]

[spinner]
rusty_cog = [0.6, 1, 1]

[piercer]
piercer_spike = [0.6, 1, 1]

; Smashable props (world/play_prop.gd): section is "prop_" + the kind. `gold` is also allowed here.
[prop_pot]
gold = [0.7, 2, 8]
health_potion = [0.08, 1, 1]
spider_silk = [0.1, 1, 1]

[prop_crate]
gold = [0.5, 3, 10]
bread_roll = [0.2, 1, 1]
rusty_cog = [0.15, 1, 1]

[prop_barrel]
gold = [0.5, 4, 12]
jelly_bun = [0.12, 1, 1]
old_coin = [0.12, 1, 1]
shield_restore = [0.08, 1, 1]

