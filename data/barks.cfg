; Lines characters murmur when you walk past (see world/npc_barks.gd).
; Section = the character's node name in the scene. Keys: morning / day / evening / night
; (the time of day), and flag_<story flag> (used while that flag is set).
; Values are quoted strings. "|" separates alternatives; one is picked at random each time.

[Yule]
morning="Morning! Mama says I can play till lunch. | Did you see how bouncy a ball can be? Mine is very bouncy."
day="Don't tell Mama I'm near the well... | Psst. Wanna hear a secret? ...There isn't one."
evening="The sky's all orange! | Almost bedtime. I don't want it to be."
night="Shhh! I'm not supposed to be up."
flag_yule_got_ball="I'm never kicking it near the well again! | Best ball in the world!"

[Brant]
morning="Fresh air. Lovely. If only I had my snacks. | Good morning! Go on, admire the ledge with me."
day="It's right there. Just out of reach. | My knees say no. My stomach says yes."
evening="Getting chilly. Almost time to light the fire."
night="Fire's nice. Not as nice as a sandwich."
flag_brant_got_pack="Snacks! Glorious snacks! | You have my eternal thanks, friend."

[Fenn]
morning="Early bird gets the perch. | Mist's lifting. Good fishing weather."
day="Not a nibble. Not one. | Shh... you'll spook them."
evening="They bite best at dusk, you know. | Another day, another empty bucket."
night="Too dark for fishing. Too stubborn to go home."
flag_fenn_got_fish="The stew is going to be legendary! | Perch! Plump little beauties!"

[Vael]
morning="Biscuit would've loved this sunshine. | Good morning, dear."
day="Have you seen my cat? Orange, grumpy, very round."
evening="I'll leave the lantern lit for Biscuit."
night="Still can't sleep without that purring."
flag_cat_found="Biscuit hasn't left my lap all day! | Home at last, my sweet grump."

[Marta]
morning="Fresh loaves, still warm! | The oven's been going since dawn."
day="Don't touch the cinnamon buns, they're counted."
evening="Half price on day-old bread soon!"
night="Dough needs kneading before sunrise..."

[MayorArse]
morning="A fine day to run a town. | Paperwork, paperwork, paperwork."
day="Chesburg doesn't run itself. Though it tries."
evening="Time to ring the bell, perhaps..."
night="The town sleeps; the mayor does not."

[ShopKeeper]
morning="Open for business! | Everything's freshly dusted, I promise."
day="Browse all you like. | A coin saved is a coin I can't have."
evening="Closing soon. Last chance for bargains!"
